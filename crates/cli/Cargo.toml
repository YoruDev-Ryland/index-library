[package]
name = "lo-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ix"
path = "src/main.rs"

[lib]
name = "lo_cli"
path = "src/lib.rs"

[dependencies]
lo-core = { path = "../core" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
