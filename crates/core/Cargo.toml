[package]
name = "lo-core"
version.workspace = true
edition.workspace = true

[lib]
name = "lo_core"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite.workspace = true
regex = "1"
once_cell = "1"
crc32fast = "1"
quick-xml = "0.37"
strsim = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
fs4 = { version = "0.13", features = ["sync"] }
sha1 = "0.10"
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
aes = "0.8"
ctr = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
# the sync server's record format (github.com/YoruDev-Ryland/index-sync-server)
index-sync-protocol = { git = "https://github.com/YoruDev-Ryland/index-sync-server" }

[dev-dependencies]
tempfile = "3"
# end-to-end sync tests run the real server in-process
index-sync-server = { git = "https://github.com/YoruDev-Ryland/index-sync-server" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
