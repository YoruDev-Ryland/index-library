<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <!-- the ground colour before any CSS loads, so a dark setting never opens on white -->
    <script>try { const t = localStorage.getItem("lo.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
    <style>
      html { background: #eeece7; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #191918; color-scheme: dark; } }
      html[data-theme="dark"] { background: #191918; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
